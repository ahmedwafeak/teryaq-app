name: Build Teryaq Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Detect Flutter Directory & Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Found pubspec.yaml at root directory"
            flutter pub get
            flutter build apk --release
            mkdir -p output_apk
            cp build/app/outputs/flutter-apk/app-release.apk output_apk/
          elif [ -f "teryaq_mobile/pubspec.yaml" ]; then
            echo "Found pubspec.yaml inside teryaq_mobile directory"
            cd teryaq_mobile
            flutter pub get
            flutter build apk --release
            cd ..
            mkdir -p output_apk
            cp teryaq_mobile/build/app/outputs/flutter-apk/app-release.apk output_apk/
          else
            echo "Error: pubspec.yaml not found in repository!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teryaq-app-release
          path: output_apk/app-release.apk
